name: Arch package

# Builds packaging/arch/PKGBUILD from this checkout in a clean Arch container,
# runs its check(), installs the result and smoke-tests it. Like the desktop VM
# job in ci.yml, it runs on release branches and on demand, not on every push.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
  # Arch is rolling: build the package weekly against whatever it has become,
  # as ci.yml does for its VM jobs.
  schedule:
    - cron: "41 8 * * 1"

permissions:
  contents: read

concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-package:
    name: makepkg in archlinux:latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Install git (needed to check out)
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every dependency of the package is in the official repositories:
      # noctalia 5 is in [extra], and only the optdepends (mpvpaper,
      # linux-wallpaperengine) are AUR, which the build and the tests do not
      # need. So there is no AUR helper and no --nodeps: the dependency names
      # and versions in the PKGBUILD are checked by pacman itself. The lists
      # come from the PKGBUILD, so the job cannot drift from it.
      # weston, ttf-dejavu, adwaita-icon-theme: the GUI suite below (the Nix
      # gui-tests check has the same icon theme). namcap: lint.
      - name: Install the package's dependencies
        run: |
          # rust first: `cargo` has more than one provider (rust, rustup), and
          # --noconfirm would otherwise choose for us.
          pacman -Syu --noconfirm --needed rust
          pacman -S --noconfirm --needed base-devel namcap weston ttf-dejavu adwaita-icon-theme
          bash -c 'source packaging/arch/PKGBUILD &&
            pacman -S --noconfirm --needed \
              "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}"'

      # makepkg refuses to run as root.
      - name: Create an unprivileged build user
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"

      - name: makepkg (build, check, package)
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' &&
            WIO_ARCH_OUT=/home/builder/out packaging/arch/local-build.sh --noconfirm"

      - name: Lint
        run: |
          cd /home/builder/out
          # Warnings are advisory; an error ( E: ) in the PKGBUILD or the package
          # fails the job. makepkg also writes a -debug package; its build-id links
          # point into the main package, which namcap reports as dangling, so that
          # package is linted for the log only.
          { namcap PKGBUILD; namcap -- wall-in-one-[0-9]*.pkg.tar.zst; } | tee /tmp/namcap.txt
          for debug in wall-in-one-debug-*.pkg.tar.zst; do
            [ -e "$debug" ] && namcap -- "$debug" || true
          done
          if grep -q ' E: ' /tmp/namcap.txt; then
            echo "namcap reported errors" >&2
            exit 1
          fi

      - name: .SRCINFO is current
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' &&
            makepkg --printsrcinfo > /tmp/srcinfo"
          diff -u "$GITHUB_WORKSPACE/packaging/arch/.SRCINFO" /tmp/srcinfo

      - name: Install the built package
        run: pacman -U --noconfirm /home/builder/out/wall-in-one-*.pkg.tar.zst

      - name: Smoke tests
        run: |
          su builder -c '
            set -eux
            HOME=$(mktemp -d)
            export HOME XDG_CONFIG_HOME=$HOME/c XDG_STATE_HOME=$HOME/s \
              XDG_CACHE_HOME=$HOME/k XDG_RUNTIME_DIR=$HOME/r
            mkdir -m 700 "$XDG_RUNTIME_DIR"
            wall-in-one --version
            wall-in-one-service --version
            wall-in-one ctl --help
            sed "s,/run/current-system/sw/bin/true,/usr/bin/true,g" \
              "$0/service/tests/fixtures/minimal-runtime.toml" > "$HOME/runtime.toml"
            wall-in-one-service --check-config \
              --config "$HOME/runtime.toml" --socket "$XDG_RUNTIME_DIR/runtime.sock"
            test ! -e "$XDG_RUNTIME_DIR/runtime.sock"
            # Both halves were built as a `system` install. package() checks
            # this on $pkgdir too; this is the installed result.
            "$0/tools/check-install-kind.sh" system /usr/bin/wall-in-one \
              /usr/bin/wall-in-one-service
            # ... and both are the release this PKGBUILD builds. The kind check above
            # only makes the halves agree with each other.
            pkgver=$(sed -n "s/^pkgver=//p" "$0/packaging/arch/PKGBUILD")
            for program in wall-in-one wall-in-one-service; do
              test "$($program --version | sed -n 1p)" = "$program $pkgver"
            done
          ' "$GITHUB_WORKSPACE"
          # Files the package must carry, at the paths the Nix package uses.
          for f in /usr/bin/wall-in-one /usr/bin/wall-in-one-service \
            /usr/share/applications/dev.goober.WallInOne.desktop \
            /usr/share/icons/hicolor/scalable/apps/dev.goober.WallInOne.svg \
            /usr/lib/systemd/user/wall-in-one.service \
            /usr/lib/systemd/user/wall-in-one-health-sync.service \
            /usr/lib/systemd/user/wall-in-one-health-sync.timer \
            /usr/share/licenses/wall-in-one/LICENSE; do
            test -f "$f"
          done

      # check() runs the non-GUI suite. The GUI suite needs a compositor, so
      # it runs here, on the repository's own headless Weston, against the
      # installed Arch libraries.
      - name: GUI tests on a headless Weston
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' &&
            export HOME=\$(mktemp -d) XDG_RUNTIME_DIR=\$(mktemp -d) &&
            export GSK_RENDERER=cairo GSETTINGS_BACKEND=memory GDK_DEBUG=no-portals GTK_USE_PORTAL=0 &&
            PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 \
              tools/headless-wayland.sh python -m pytest tests -q -ra -p no:cacheprovider -m gui \
                --junitxml=/tmp/gui-results.xml"

      # The same guards as the flake's gui-tests check: a suite that collected
      # nothing, or skipped tests for want of a display, is not a pass.
      - name: GUI tests ran, and none was skipped
        run: |
          grep -Eq 'tests="[1-9][0-9]*"' /tmp/gui-results.xml
          if grep -Eq 'skipped="[1-9][0-9]*"' /tmp/gui-results.xml; then
            echo "the display-backed GUI suite skipped tests" >&2
            cat /tmp/gui-results.xml >&2
            exit 1
          fi
