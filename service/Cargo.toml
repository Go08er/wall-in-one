[package]
name = "wall-in-one-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Session-scoped runtime for Wall-in-One"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

