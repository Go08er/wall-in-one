schema_version = 2
default_playlist = "one"

[settings]
cycle_interval_seconds = 300
cycle_enabled = false
shuffle = false
dynamics_enabled = false

[renderer]
noctalia_program = "/run/current-system/sw/bin/true"
niri_program = "/run/current-system/sw/bin/true"
mpvpaper_program = "/run/current-system/sw/bin/true"
linux_wallpaperengine_program = "/run/current-system/sw/bin/true"
own_scene_renderer = false
layer = "background"
video_when_hidden = "pause"
video_hardware_decode = true
video_muted = true
video_volume = 0
scene_fps = 30
scene_muted = true
scene_volume = 0
scene_pause_when_covered = true
scene_scaling = ""
scene_clamp = ""

[[playlists]]
id = "one"
name = "One"

[[playlists.entries]]
id = "still"
kind = "still"
still = "/tmp/wall-in-one-measurement.png"
palette = { kind = "keep", mode = "keep" }
