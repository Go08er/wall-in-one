id = "goober/wall-in-one"
name = "Wall-in-One"
version = "0.1.3"
plugin_api = 17
author = "goober"
license = "MIT"
icon = "library-photo"
description = "Launch and control the Wall-in-One wallpaper app from Noctalia."
deprecated = false
tags = ["bar", "panel", "service", "theming", "utility", "video", "wallpaper"]
dependencies = ["wall-in-one"]

# Both settings belong to the singleton service: it owns the only process that
# talks to the app, so a second bar placement must not be able to poll at a
# different rate or point at a different binary.
[[setting]]
key = "refresh_interval_seconds"
type = "int"
label_key = "settings.refresh.label"
description_key = "settings.refresh.description"
default = 15
min = 5
max = 300
step = 5

[[setting]]
key = "binary_path"
type = "file"
label_key = "settings.binary.label"
description_key = "settings.binary.description"
default = ""
advanced = true

[[service]]
id = "control"
entry = "service.luau"

[[widget]]
id = "wall-in-one"
entry = "widget.luau"

  # The widget is deliberately only a way into the playlist menu. Wallpaper
  # playback policy belongs to the standalone app, not to hidden bar gestures.
  [widget.actions]
  left = "panel-toggle goober/wall-in-one:controls"
  right = "panel-toggle goober/wall-in-one:controls"

  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.display_mode.label"
  description_key = "settings.display_mode.description"
  default = "always"
  options = [
    { value = "always", label_key = "display_mode.always" },
    { value = "on_hover", label_key = "display_mode.on_hover" },
    { value = "icon_only", label_key = "display_mode.icon_only" },
  ]

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyphs.active"
  description_key = "settings.glyphs.description"
  default = "library-photo"

  [[widget.setting]]
  key = "stopped_glyph"
  type = "glyph"
  label_key = "settings.glyphs.stopped"
  description_key = "settings.glyphs.description"
  default = "photo-off"

  [[widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.colors.active"
  default = "on_surface"

  [[widget.setting]]
  key = "stopped_color"
  type = "color"
  label_key = "settings.colors.stopped"
  default = "on_surface_variant"

[[panel]]
id = "controls"
entry = "panel.luau"
width = 340
height = 440
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
