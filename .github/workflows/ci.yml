name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Python, Rust, and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate the complete flake
        run: nix flake check --no-build
      - name: Build the fast checks
        run: >-
          nix build -L
          .#checks.x86_64-linux.wall-in-one
          .#checks.x86_64-linux.wall-in-one-service
          .#checks.x86_64-linux.companion-plugin-contract
          .#checks.x86_64-linux.runtime-socket-fallback
          .#checks.x86_64-linux.service-rss
          .#checks.x86_64-linux.gui-tests
          .#checks.x86_64-linux.mypy
          .#checks.x86_64-linux.desktop
          .#checks.x86_64-linux.ruff
      - name: Check Rust formatting and lints
        run: >-
          nix develop --command bash -c
          'cargo fmt --manifest-path service/Cargo.toml --check &&
          cargo clippy --manifest-path service/Cargo.toml --all-targets -- -D warnings'

  desktop-vm:
    name: niri + Noctalia desktop VM
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and run the desktop VM check
        run: nix build -L .#checks.x86_64-linux.vm-test
