[package]
name = "wall-in-one-service"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Session-scoped runtime for Wall-in-One"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: numbers are parsed correctly rounded, as the app's reader
# (Python's float) parses them, so a project's number near the largest f64 is
# out of range for both or for neither (workshop::refusal, R42-15). No crate is
# added; parsing a float costs more, and a project.json holds few.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "1"
# Display discovery over the compositor's own Wayland protocols (wl_output,
# xdg-output, wlr-output-management). The pure-Rust backend: no libwayland.
# `log`: the Wayland crates' own error messages go through the `log` crate,
# for which this service installs no logger, instead of straight to stderr
# unprefixed. Discovery failures are reported by the service itself
# (`output_discovery_error`, and its own prefixed lines).
wayland-backend = { version = "0.3", features = ["log"] }
wayland-client = { version = "0.31", features = ["log"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
# Only for this package's own tests, which turn it on below: what lets a test
# make a reply carry the build strings it compares against
# (`Runtime::set_runtime_executable_for_tests`). The service never has it.
test-support = []

[dev-dependencies]
wall-in-one-service = { path = ".", features = ["test-support"] }

[profile.release]
# The daemon is resident for the whole graphical session. Its event loop is
# intentionally tiny and measured far below the idle CPU ceiling, while every
# additional code page counts against the one-display RSS target. Prefer the
# smallest optimized machine code and keep the CPU/RSS matrix as the arbiter.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
